[build-system]
requires = [
  "pybind11",
  "numpy>=1.23",
  "setuptools",
  "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "richdem"
description = "Python interface to the RichDEM terrain analysis library."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Richard Barnes", email = "rbarnes@umn.edu" },
]
keywords = ["GIS", "terrain", "hydrology", "geomorphology", "raster"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.23",
]
dynamic = [
  "version",
]

[project.optional-dependencies]
gdal = ["gdal"]

[project.scripts]
rd_depression_filling = "richdem.cli:depression_filling"
rd_breach_depressions = "richdem.cli:breach_depressions"
rd_flow_accumulation = "richdem.cli:flow_accumulation"
rd_terrain_attribute = "richdem.cli:terrain_attribute"
rd_info = "richdem.cli:rd_info"
rd_compare = "richdem.cli:rd_compare"

[tool.setuptools.dynamic.version]
attr = "richdem._version.__version__"

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-win32", "*-manylinux_i686*", "*-musllinux_i686*"]
environment-pass = ["OPENMP_PREFIX"]
environment = """
RICHDEM_PREFIX="$(pwd -P)/dist/" \
MACOSX_DEPLOYMENT_TARGET=11.0
"""
before-build = """
mkdir -p build
cd build
cmake -S ../vendor/cmake \
  -DCMAKE_INSTALL_PREFIX=$RICHDEM_PREFIX \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_INSTALL_LIBDIR=lib
make
make install
"""
test-command = """
python -c "import richdem; print(f'pyrichdem={richdem.__version__}, richdem={richdem.richdem_version}')"
"""

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
repair-wheel-command = """
LD_LIBRARY_PATH="$RICHDEM_PREFIX/lib:${LD_LIBRARY_PATH:-}" \
   auditwheel repair -w {dest_dir} {wheel}
"""

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
repair-wheel-command = """
DYLD_LIBRARY_PATH="$RICHDEM_PREFIX/lib:$OPENMP_PREFIX/lib:${LD_LIBRARY_PATH:-}" \
  delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
"""

[tool.cibuildwheel.windows]
archs = ["AMD64"]
environment = "RICHDEM_PREFIX=%CD%/dist"
before-build = [
  "cmake -S vendor\\cmake -B build -DCMAKE_INSTALL_PREFIX=%RICHDEM_PREFIX% -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib",
  "cmake --build build --config Release",
  "cmake --install build --config Release",
]
